<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสแกนใบหน้าลงเวลา</title>
  <meta name="theme-color" content="#0f172a">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', 'Sarabun', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    h1 {
      font-size: 20px;
      margin: 5px 0 15px;
      text-align: center;
    }

    .control-group {
      width: 100%;
      max-width: 480px;
      margin-bottom: 12px;
    }

    label {
      font-size: 13px;
      color: #94a3b8;
      display: block;
      margin-bottom: 4px;
    }

    select {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border-radius: 8px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #f1f5f9;
      outline: none;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4/3;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 4px solid #334155;
    }

    video,
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #status {
      margin-top: 12px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      min-height: 24px;
    }

    #result {
      margin-top: 8px;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      min-height: 32px;
      padding: 6px 16px;
      border-radius: 10px;
    }

    .result-in {
      background: #14532d;
      color: #86efac;
    }

    .result-out {
      background: #7c2d12;
      color: #fdba74;
    }

    .log-list {
      margin-top: 15px;
      width: 100%;
      max-width: 480px;
    }

    .log-item {
      display: flex;
      justify-content: space-between;
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <h1>🕒 ระบบสแกนใบหน้าเข้า-ออกงาน</h1>

  <div class="control-group" style="display: flex; gap: 8px; align-items: flex-end;">
    <div style="flex: 1;">
      <label for="actionType">รายการลงเวลา (เลือกให้อัตโนมัติ):</label>
      <select id="actionType">
        <option value="เข้างาน">เข้างานปกติ</option>
        <option value="ออกงาน">ออกงานปกติ</option>
        <option value="เข้าทำ OT">เข้าทำ OT</option>
        <option value="ออก OT">ออก OT (คำนวณเงิน)</option>
      </select>
    </div>
    <button id="switchCamBtn"
      style="padding: 10px 14px; font-size: 15px; border-radius: 8px; border: 2px solid #334155; background: #1e293b; color: #f1f5f9; cursor: pointer; height: 44px;">🔄
      สลับกล้อง</button>
  </div>

  <div class="video-wrap">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="status">กำลังเริ่มต้นระบบ...</div>
  <div id="result"></div>

  <div class="log-list">
    <h3 style="font-size: 13px; color: #94a3b8;">ประวัติการลงเวลาล่าสุดวันนี้</h3>
    <div id="logItems"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <script>
    const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxYd1DDEb7QUldQ-iQhY8lxgHENwrbg1NHCFBfLBqcfnM3s_Er6lBX8H38N7p6N7AElZQ/exec';

    let employeesData = [];
    let todayStatusMap = {};
    let matcher = null;
    let isProcessing = false;
    let lastLoggedTime = {};
    const COOLDOWN_MS = 8000;
    let currentFacingMode = 'user';
    let hasTurnedHead = false;
    let turnProgress = 0;

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 800; osc.type = 'sine';
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.start(); osc.stop(ctx.currentTime + 0.15);
      } catch (e) { }
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'th-TH'; utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    function setStatus(text) { document.getElementById('status').innerText = text; }

    async function init() {
      try {
        setStatus('กำลังเปิดกล้องและโหลด AI...');
        await Promise.all([startCamera(), loadModels(), loadEmployees()]);

        document.getElementById('switchCamBtn').addEventListener('click', async () => {
          currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
          await startCamera();
        });

        if (matcher) {
          setStatus('✅ พร้อมสแกน — กรุณามองกล้องและหันหน้าเล็กน้อยเพื่อยืนยัน');
          detectLoop();
        }
      } catch (err) { setStatus('❌ เกิดข้อผิดพลาด: ' + err.message); }
    }

    async function loadModels() {
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
      ]);
    }

    async function loadEmployees() {
      try {
        const response = await fetch(WEB_APP_URL + '?action=getEmployees');
        const resData = await response.json();
        employeesData = resData.employees || [];
        todayStatusMap = resData.todayStatus || {};

        const labeledDescriptors = [];
        await Promise.all(employeesData.map(async (emp) => {
          try {
            const img = await faceapi.fetchImage(emp.dataUrl);
            const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions({ inputSize: 224 }))
              .withFaceLandmarks().withFaceDescriptor();
            if (detection) labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(emp.id, [detection.descriptor]));
          } catch (e) { }
        }));

        if (labeledDescriptors.length > 0) {
          matcher = new faceapi.FaceMatcher(labeledDescriptors, 0.5);
        }
      } catch (err) { setStatus('⚠️ เกิดข้อผิดพลาดโหลดข้อมูล: ' + err.message); }
    }

    async function startCamera() {
      const video = document.getElementById('video');
      if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: currentFacingMode, width: { ideal: 640 }, height: { ideal: 480 } }
      });
      video.srcObject = stream;
      video.style.transform = currentFacingMode === 'user' ? 'scaleX(-1)' : 'none';
      document.getElementById('overlay').style.transform = video.style.transform;
    }

    function autoSelectActionForEmployee(empId) {
      const status = todayStatusMap[empId] || {};
      const actionSelect = document.getElementById('actionType');
      if (!status.lastNormal) actionSelect.value = 'เข้างาน';
      else if (status.lastNormal === 'เข้างาน') actionSelect.value = 'ออกงาน';
      else if (status.lastNormal === 'ออกงาน') {
        if (!status.lastOT) actionSelect.value = 'เข้าทำ OT';
        else if (status.lastOT === 'เข้าทำ OT') actionSelect.value = 'ออก OT';
        else actionSelect.value = 'เข้างาน';
      }
    }

    function addLogItem(name, type, time) {
      const container = document.getElementById('logItems');
      const div = document.createElement('div');
      div.className = 'log-item';
      div.innerHTML = `<span>${name}</span><span class="badge" style="background:#334155; color:#fff;">${type} • ${time}</span>`;
      container.prepend(div);
      while (container.children.length > 8) container.removeChild(container.lastChild);
    }

    function drawProgressCircle(ctx, box, progress) {
      const centerX = box.x + box.width / 2;
      const centerY = box.y + box.height / 2;
      const radius = Math.max(box.width, box.height) / 2 + 15;
      ctx.beginPath(); ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.lineWidth = 6; ctx.stroke();
      ctx.beginPath(); ctx.arc(centerX, centerY, radius, -Math.PI / 2, (-Math.PI / 2) + (2 * Math.PI * progress));
      ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 6; ctx.stroke();
    }

    function detectLoop() {
      const video = document.getElementById('video');
      const overlay = document.getElementById('overlay');

      setInterval(async () => {
        if (isProcessing || !matcher || video.paused || video.readyState < 3) return;
        isProcessing = true;

        try {
          const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }))
            .withFaceLandmarks().withFaceDescriptor();

          const dims = faceapi.matchDimensions(overlay, video, true);
          const ctx = overlay.getContext('2d');
          ctx.clearRect(0, 0, overlay.width, overlay.height);

          if (detection) {
            const match = matcher.findBestMatch(detection.descriptor);
            const resized = faceapi.resizeResults(detection, dims);
            const landmarks = resized.landmarks.positions;
            const distLeft = Math.abs(landmarks[30].x - landmarks[2].x);
            const distRight = Math.abs(landmarks[14].x - landmarks[30].x);
            const yawRatio = distLeft / (distLeft + distRight);

            if (match.label !== 'unknown') {
              const empId = match.label;
              const empObj = employeesData.find(e => e.id === match.label);
              const empName = empObj ? empObj.name : empId;

              autoSelectActionForEmployee(empId);

              if (yawRatio < 0.35 || yawRatio > 0.65) {
                turnProgress = Math.min(1.0, turnProgress + 0.35);
                if (turnProgress >= 1.0) hasTurnedHead = true;
              } else {
                turnProgress = Math.max(0.1, turnProgress - 0.05);
              }

              const box = resized.detection.box;
              drawProgressCircle(ctx, box, turnProgress);
              new faceapi.draw.DrawBox(box, {
                label: `${empName} (${((1 - match.distance) * 100).toFixed(0)}%) ${hasTurnedHead ? '🔓' : '🔒 หันหน้าเพื่อยืนยัน'}`,
                boxColor: '#10b981'
              }).draw(overlay);

              const now = Date.now();
              if (!lastLoggedTime[empId] || now - lastLoggedTime[empId] > COOLDOWN_MS) {
                if (!hasTurnedHead) {
                  setStatus('🔒 ตรวจพบคุณ ' + empName + ' — กรุณาหันหน้าเล็กน้อย...');
                  return;
                }

                lastLoggedTime[empId] = now;
                hasTurnedHead = false; turnProgress = 0;
                const actionType = document.getElementById('actionType').value;
                setStatus('พบใบหน้า: ' + empName + ' (' + actionType + ') — กำลังบันทึก...');

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640; canvas.height = video.videoHeight || 480;
                const cCtx = canvas.getContext('2d');
                if (currentFacingMode === 'user') { cCtx.translate(canvas.width, 0); cCtx.scale(-1, 1); }
                cCtx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const res = await fetch(WEB_APP_URL, {
                  method: 'POST',
                  body: JSON.stringify({
                    empId: empId, name: empName,
                    department: empObj ? empObj.department : 'ทั่วไป',
                    actionType: actionType, confidence: (1 - match.distance).toFixed(2),
                    snapshot: canvas.toDataURL('image/jpeg', 0.8)
                  })
                });
                const data = await res.json();

                if (data.success) {
                  playBeep();
                  speak(`บันทึกเวลา${actionType}สำเร็จแล้วค่ะ คุณ${empName}`);
                  if (!todayStatusMap[empId]) todayStatusMap[empId] = {};
                  if (actionType === 'เข้างาน' || actionType === 'ออกงาน') todayStatusMap[empId].lastNormal = actionType;
                  if (actionType === 'เข้าทำ OT' || actionType === 'ออก OT') todayStatusMap[empId].lastOT = actionType;

                  document.getElementById('result').className = actionType.includes('เข้า') ? 'result-in' : 'result-out';
                  document.getElementById('result').innerText = `${empName} — ${actionType} (${data.displayTime})`;
                  addLogItem(empName, actionType, data.displayTime);
                  setStatus('✅ บันทึกสำเร็จเรียบร้อย');
                } else {
                  speak('บันทึกไม่สำเร็จ ' + data.error);
                  setStatus('❌ ' + data.error);
                }
              }
            } else { turnProgress = 0; hasTurnedHead = false; }
          }
        } catch (err) { } finally { isProcessing = false; }
      }, 300);
    }

    init();
  </script>
</body>

</html>
