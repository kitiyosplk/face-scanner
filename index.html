<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสแกนใบหน้าเข้า-ออกงานและ OT</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', 'Sarabun', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      font-size: 22px;
      margin: 10px 0 15px;
      text-align: center;
    }

    .control-group {
      width: 100%;
      max-width: 480px;
      margin-bottom: 12px;
      text-align: left;
    }

    .control-group label {
      font-size: 14px;
      color: #94a3b8;
      display: block;
      margin-bottom: 4px;
    }

    select {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #f1f5f9;
      outline: none;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4/3;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 4px solid #334155;
    }

    video,
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #status {
      margin-top: 15px;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      min-height: 24px;
    }

    #result {
      margin-top: 8px;
      font-size: 20px;
      font-weight: 800;
      text-align: center;
      min-height: 36px;
      padding: 6px 16px;
      border-radius: 10px;
      transition: all 0.2s;
    }

    .result-in {
      background: #14532d;
      color: #86efac;
    }

    .result-out {
      background: #7c2d12;
      color: #fdba74;
    }

    .result-ot-in {
      background: #1e3a8a;
      color: #93c5fd;
    }

    .result-ot-out {
      background: #581c87;
      color: #d8b4fe;
    }

    .log-list {
      margin-top: 20px;
      width: 100%;
      max-width: 480px;
    }

    .log-list h3 {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .log-item {
      display: flex;
      justify-content: space-between;
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <h1>🕒 ระบบสแกนใบหน้าเข้า-ออกงานและ OT</h1>

  <div class="control-group" style="display: flex; gap: 8px; align-items: flex-end;">
    <div style="flex: 1;">
      <label for="actionType">เลือกรายการลงเวลา:</label>
      <select id="actionType">
        <option value="เข้างาน">เข้างานปกติ</option>
        <option value="ออกงาน">ออกงานปกติ</option>
        <option value="เข้าทำ OT">เข้าทำ OT</option>
        <option value="ออก OT">ออก OT (คำนวณเงินอัตโนมัติ)</option>
      </select>
    </div>
    <button id="switchCamBtn" style="padding: 10px 16px; font-size: 16px; border-radius: 8px; border: 2px solid #334155; background: #1e293b; color: #f1f5f9; cursor: pointer; height: 44px; font-weight: 600;">🔄 สลับกล้อง</button>
  </div>

  <div class="video-wrap">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="status">กำลังเริ่มต้นระบบ...</div>
  <div id="result"></div>

  <div class="log-list">
    <h3>รายการล่าสุด</h3>
    <div id="logItems"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script>
    const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';

    // URL ของ Apps Script ที่พี่ปิ๊ก Deploy ไว้
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxYd1DDEb7QUldQ-iQhY8lxgHENwrbg1NHCFBfLBqcfnM3s_Er6lBX8H38N7p6N7AElZQ/exec';

    let employeesData = [];
    let matcher = null;
    let isProcessing = false;
    let lastLoggedTime = {};
    const COOLDOWN_MS = 8000;
    let currentFacingMode = 'user';
    let hasBlinked = false;

    function setStatus(text) {
      document.getElementById('status').innerText = text;
    }

    async function init() {
      try {
        setStatus('กำลังเปิดกล้อง...');
        await startCamera();

        // เชื่อมโยงปุ่มสลับกล้อง
        document.getElementById('switchCamBtn').addEventListener('click', async () => {
          currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
          setStatus('กำลังสลับกล้อง...');
          try {
            await startCamera();
            setStatus('✅ สลับกล้องสำเร็จ — พร้อมสแกน');
          } catch (err) {
            setStatus('❌ สลับกล้องล้มเหลว: ' + err.message);
          }
        });

        setStatus('กำลังโหลดโมเดล AI...');
        await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

        setStatus('กำลังโหลดข้อมูลพนักงานจาก Drive...');
        await loadEmployees();

        if (matcher) {
          setStatus('✅ พร้อมสแกน — กรุณามองกล้องให้เห็นหน้าชัดเจน');
          detectLoop();
        } else {
          setStatus('⚠️ กล้องพร้อมทำงาน แต่ยังไม่มีข้อมูลพนักงานเพื่อสแกนใบหน้า');
        }
      } catch (err) {
        console.error(err);
        setStatus('❌ เกิดข้อผิดพลาด: ' + err.message);
      }
    }

    async function loadEmployees() {
      try {
        const response = await fetch(WEB_APP_URL + '?action=getEmployees');
        const text = await response.text();
        
        if (text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html')) {
          throw new Error('ระบบส่งค่ากลับเป็น HTML แทนพนักงาน JSON');
        }

        employeesData = JSON.parse(text);

        const labeledDescriptors = [];
        for (const emp of employeesData) {
          try {
            const img = await faceapi.fetchImage(emp.dataUrl);
            const detection = await faceapi.detectSingleFace(img)
              .withFaceLandmarks().withFaceDescriptor();
            if (detection) {
              labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(emp.id, [detection.descriptor]));
            } else {
              console.warn('ไม่สามารถตรวจจับใบหน้าจากรูปพนักงาน:', emp.name);
            }
          } catch (e) {
            console.warn('โหลดรูปพนักงานล้มเหลว:', emp.name, e);
          }
        }

        if (labeledDescriptors.length > 0) {
          matcher = new faceapi.FaceMatcher(labeledDescriptors, 0.5);
          setStatus('โหลดข้อมูลพนักงานสำเร็จ (' + labeledDescriptors.length + ' คน)');
        } else {
          matcher = null;
          setStatus('⚠️ ไม่พบภาพใบหน้าพนักงาน หรือสแกนหาใบหน้าในรูปไม่พบ');
        }
      } catch (err) {
        console.error(err);
        setStatus('⚠️ เกิดข้อผิดพลาดในการดึงข้อมูลพนักงาน: ' + err.message);
      }
    }

    async function startCamera() {
      const video = document.getElementById('video');
      const overlay = document.getElementById('overlay');

      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: currentFacingMode, width: { ideal: 640 }, height: { ideal: 480 } }
      });
      video.srcObject = stream;

      // จัดการ Mirror ซ้ายขวา: กล้องหน้าให้ Mirror, กล้องหลังไม่ต้อง Mirror
      video.style.transform = currentFacingMode === 'user' ? 'scaleX(-1)' : 'none';
      overlay.style.transform = currentFacingMode === 'user' ? 'scaleX(-1)' : 'none';

      return new Promise(resolve => (video.onloadedmetadata = resolve));
    }

    function addLogItem(name, type, time) {
      const container = document.getElementById('logItems');
      const div = document.createElement('div');
      div.className = 'log-item';
      div.innerHTML = `<span>${name}</span><span class="badge" style="background:#334155; color:#fff;">${type} • ${time}</span>`;
      container.prepend(div);
      while (container.children.length > 8) container.removeChild(container.lastChild);
    }

    function detectLoop() {
      const video = document.getElementById('video');
      const overlay = document.getElementById('overlay');

      setInterval(async () => {
        if (isProcessing || !matcher) return;
        isProcessing = true;

        const detection = await faceapi
          .detectSingleFace(video, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.5 }))
          .withFaceLandmarks()
          .withFaceDescriptor();

        const dims = faceapi.matchDimensions(overlay, video, true);
        overlay.getContext('2d').clearRect(0, 0, overlay.width, overlay.height);

        if (detection) {
          const match = matcher.findBestMatch(detection.descriptor);
          const resized = faceapi.resizeResults(detection, dims);

          // คำนวณ Eye Aspect Ratio (EAR) เพื่อตรวจจับการกะพริบตา (Liveness Detection)
          const landmarks = resized.landmarks.positions;
          const leftEye = landmarks.slice(36, 42);
          const rightEye = landmarks.slice(42, 48);

          const getDistance = (p1, p2) => Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
          const getEAR = (eye) => {
            const d_v1 = getDistance(eye[1], eye[5]);
            const d_v2 = getDistance(eye[2], eye[4]);
            const d_h = getDistance(eye[0], eye[3]);
            return (d_v1 + d_v2) / (2.0 * d_h);
          };

          const leftEAR = getEAR(leftEye);
          const rightEAR = getEAR(rightEye);
          const avgEAR = (leftEAR + rightEAR) / 2;

          // วาดกรอบตรวจจับใบหน้าพร้อมแสดงชื่อผู้ใช้และเปอร์เซ็นต์ความมั่นใจ
          let boxLabel = 'ไม่พบพนักงานในระบบ';
          if (match.label !== 'unknown') {
            const empObj = employeesData.find(e => e.id === match.label);
            const name = empObj ? empObj.name : match.label;
            const matchPercent = ((1 - match.distance) * 100).toFixed(0);
            boxLabel = `${name} (${matchPercent}%)`;
            if (!hasBlinked) {
              boxLabel += ' - 🔒 กะพริบตาเพื่อบันทึก';
            } else {
              boxLabel += ' - 🔓 ยืนยันตัวตนแล้ว';
            }
          }

          const box = resized.detection.box;
          const drawBox = new faceapi.draw.DrawBox(box, { 
            label: boxLabel, 
            boxColor: match.label !== 'unknown' ? '#10b981' : '#ef4444' 
          });
          drawBox.draw(overlay);

          if (match.label !== 'unknown') {
            const empId = match.label;
            const empObj = employeesData.find(e => e.id === empId);
            const empName = empObj ? empObj.name : empId;
            const empDept = empObj ? empObj.department : 'ทั่วไป';

            const now = Date.now();
            if (!lastLoggedTime[empId] || now - lastLoggedTime[empId] > COOLDOWN_MS) {
              
              // ป้องกันการใช้รูปถ่าย: บังคับให้สแกนเจอกระพริบตา (EAR < 0.22 คือตามีขนาดแคบลง/ปิด)
              if (!hasBlinked) {
                setStatus('🔒 ตรวจพบพนักงาน ' + empName + ' — กรุณากะพริบตา 1 ครั้งเพื่อยืนยันตัวตน...');
                if (avgEAR < 0.22) {
                  hasBlinked = true;
                  setStatus('🔓 ยืนยันตัวตนพนักงานสำเร็จ! กำลังส่งข้อมูลบันทึกเวลา...');
                }
                isProcessing = false;
                return;
              }

              lastLoggedTime[empId] = now;
              hasBlinked = false; // รีเซ็ตสำหรับรอบถัดไป

              const actionType = document.getElementById('actionType').value;
              setStatus('พบใบหน้า: ' + empName + ' (' + actionType + ') — กำลังบันทึก...');

              // ถ่ายภาพ Snapshot เป็นหลักฐาน
              const canvas = document.createElement('canvas');
              canvas.width = video.videoWidth || 640;
              canvas.height = video.videoHeight || 480;
              const ctx = canvas.getContext('2d');
              
              // วาดรูปจากกล้อง (สลับซ้ายขวาตามโหมดกล้องหน้าเพื่อให้ภาพตรงกับที่ผู้ใช้เห็น)
              if (currentFacingMode === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
              }
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              
              // คืนค่ารูปแบบทรานสเลชั่นปกติ
              if (currentFacingMode === 'user') {
                ctx.setTransform(1, 0, 0, 1, 0, 0);
              }
              const snapshotBase64 = canvas.toDataURL('image/jpeg', 0.8);

              try {
                const res = await fetch(WEB_APP_URL, {
                  method: 'POST',
                  body: JSON.stringify({
                    empId: empId,
                    name: empName,
                    department: empDept,
                    actionType: actionType,
                    confidence: (1 - match.distance).toFixed(2),
                    snapshot: snapshotBase64
                  })
                });
                const data = await res.json();

                if (!data.success) {
                  throw new Error(data.error || 'เกิดข้อผิดพลาดในการบันทึกข้อมูล');
                }

                const resultEl = document.getElementById('result');
                if (actionType === 'เข้างาน') resultEl.className = 'result-in';
                else if (actionType === 'ออกงาน') resultEl.className = 'result-out';
                else if (actionType === 'เข้าทำ OT') resultEl.className = 'result-ot-in';
                else if (actionType === 'ออก OT') resultEl.className = 'result-ot-out';

                resultEl.innerText = `${empName} — ${actionType} (${data.displayTime})${data.otTotal ? ' [OT: ' + data.otTotal + ' ฿]' : ''}`;
                addLogItem(empName, actionType, data.displayTime);
                setStatus('✅ พร้อมสแกน — กรุณามองกล้องให้เห็นหน้าชัดเจน');
              } catch (e) {
                setStatus('❌ บันทึกไม่สำเร็จ: ' + e.message);
              }
            }
          }
        } else {
          // หากไม่มีการตรวจพบใบหน้า ให้รีเซ็ตสถานะสแกนกะพริบตา
          hasBlinked = false;
        }

        isProcessing = false;
      }, 1200);
    }

    init();
  </script>
</body>

</html>
