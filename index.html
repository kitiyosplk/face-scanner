<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสแกนใบหน้าลงเวลา (Smart Kiosk)</title>
  <meta name="theme-color" content="#0f172a">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', 'Sarabun', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    h1 {
      font-size: 20px;
      margin: 5px 0 15px;
      text-align: center;
    }

    .control-card {
      width: 100%;
      max-width: 480px;
      background: #1e293b;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #334155;
    }

    .status-badge-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .badge-label {
      font-size: 11px;
      color: #94a3b8;
    }

    .action-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
    }

    .badge-normal {
      background: #14532d;
      color: #86efac;
    }

    .badge-late {
      background: #7c2d12;
      color: #fdba74;
    }

    .badge-ot {
      background: #1e3a8a;
      color: #93c5fd;
    }

    .btn-action {
      padding: 8px 12px;
      font-size: 13px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #334155;
      color: #f1f5f9;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-action:hover {
      background: #475569;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4/3;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 4px solid #334155;
    }

    video,
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 💡 Quick Action Pop-up Overlay (ข้อ 3) */
    .quick-popup {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #3b82f6;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      width: 85%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 10;
      display: none;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from {
        transform: translate(-50%, -40%) scale(0.8);
        opacity: 0;
      }

      to {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    }

    .quick-popup h2 {
      margin: 0 0 6px;
      font-size: 18px;
      color: #38bdf8;
    }

    .quick-popup p {
      margin: 4px 0;
      font-size: 14px;
    }

    #status {
      margin-top: 12px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      min-height: 24px;
      color: #cbd5e1;
    }

    #result {
      margin-top: 8px;
      font-size: 16px;
      font-weight: 800;
      text-align: center;
      min-height: 32px;
      padding: 6px 16px;
      border-radius: 10px;
    }

    .result-in {
      background: #14532d;
      color: #86efac;
    }

    .result-out {
      background: #7c2d12;
      color: #fdba74;
    }

    .log-list {
      margin-top: 15px;
      width: 100%;
      max-width: 480px;
    }

    .log-item {
      display: flex;
      justify-content: space-between;
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 13px;
    }

    /* Modal ปรับเปลี่ยนรายการด้วยมือ */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 360px;
      border: 1px solid #475569;
    }

    .modal-card select {
      width: 100%;
      padding: 10px;
      margin: 12px 0;
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      border: 1px solid #475569;
    }
  </style>
</head>

<body>
  <h1>🕒 ระบบสแกนใบหน้าลงเวลา</h1>

  <!-- 💡 ข้อ 1: ป้ายแสดงสถานะ (แทนการใช้ Dropdown แบบเดิม) -->
  <div class="control-card">
    <div class="status-badge-container">
      <span class="badge-label">รายการที่จะบันทึก (เลือกให้อัตโนมัติ):</span>
      <span id="actionBadge" class="action-badge badge-normal">🟢 เข้างานปกติ</span>
    </div>
    <div style="display: flex; gap: 6px;">
      <button class="btn-action" onclick="openManualModal()">✏️ สลับ</button>
      <button id="switchCamBtn" class="btn-action">🔄 กล้อง</button>
    </div>
  </div>

  <div class="video-wrap">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>

    <!-- 💡 ข้อ 3: Quick Action Pop-up แสดง 3 วินาทีเมื่อสแกนติด -->
    <div id="quickPopup" class="quick-popup">
      <h2>🎉 บันทึกเวลาสำเร็จ!</h2>
      <p id="popupName" style="font-size: 16px; font-weight: bold;"></p>
      <p id="popupType"></p>
      <div style="margin-top: 12px;">
        <button class="btn-action" onclick="openManualModal()"
          style="background: #eab308; color: #000; font-weight: bold;">⚠️ เปลี่ยนรายการ</button>
      </div>
    </div>
  </div>

  <div id="status">กำลังเริ่มต้นระบบ...</div>
  <div id="result"></div>

  <div class="log-list">
    <h3 style="font-size: 13px; color: #94a3b8;">ประวัติการลงเวลาล่าสุดวันนี้</h3>
    <div id="logItems"></div>
  </div>

  <!-- Modal สำหรับเลือกเปลี่ยนรายการด้วยมือ -->
  <div id="overrideModal" class="modal">
    <div class="modal-card">
      <h3 style="margin-top:0;">เปลี่ยนรายการลงเวลา</h3>
      <select id="manualActionSelect">
        <option value="เข้างาน">เข้างานปกติ</option>
        <option value="เข้างาน (สาย)">เข้างาน (สาย)</option>
        <option value="ออกงาน">ออกงานปกติ</option>
        <option value="เข้าทำ OT">เข้าทำ OT</option>
        <option value="ออก OT">ออก OT</option>
      </select>
      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <button class="btn-action" onclick="closeManualModal()">ยกเลิก</button>
        <button class="btn-action" onclick="applyManualAction()" style="background: #22c55e; border:none;">ตกลง</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <script>
    const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxYd1DDEb7QUldQ-iQhY8lxgHENwrbg1NHCFBfLBqcfnM3s_Er6lBX8H38N7p6N7AElZQ/exec';

    let employeesData = [];
    let todayStatusMap = {};
    let matcher = null;
    let isProcessing = false;
    let lastLoggedTime = {};
    const COOLDOWN_MS = 8000;
    let currentFacingMode = 'user';
    let hasTurnedHead = false;
    let turnProgress = 0;
    let manualOverrideAction = null;
    let popupTimer = null;

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 800; osc.type = 'sine';
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.start(); osc.stop(ctx.currentTime + 0.15);
      } catch (e) { }
    }

    // 💡 ข้อ 5: เสียงพูดตอบรับแบบคมชัด
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'th-TH'; utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    function setStatus(text) { document.getElementById('status').innerText = text; }

    async function init() {
      try {
        setStatus('กำลังเปิดกล้องและโหลด AI...');
        await Promise.all([startCamera(), loadModels(), loadEmployees()]);

        document.getElementById('switchCamBtn').addEventListener('click', async () => {
          currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
          await startCamera();
        });

        if (matcher) {
          setStatus('✅ พร้อมสแกน — กรุณามองกล้องและหันหน้าเล็กน้อยเพื่อยืนยัน');
          detectLoop();
        }
      } catch (err) { setStatus('❌ เกิดข้อผิดพลาด: ' + err.message); }
    }

    async function loadModels() {
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
      ]);
    }

    async function loadEmployees() {
      try {
        const response = await fetch(WEB_APP_URL + '?action=getEmployees');
        const resData = await response.json();
        employeesData = resData.employees || [];
        todayStatusMap = resData.todayStatus || {};

        const labeledDescriptors = [];
        await Promise.all(employeesData.map(async (emp) => {
          try {
            const img = await faceapi.fetchImage(emp.dataUrl);
            const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions({ inputSize: 224 }))
              .withFaceLandmarks().withFaceDescriptor();
            if (detection) labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(emp.id, [detection.descriptor]));
          } catch (e) { }
        }));

        if (labeledDescriptors.length > 0) {
          matcher = new faceapi.FaceMatcher(labeledDescriptors, 0.5);
        }
      } catch (err) { setStatus('⚠️ เกิดข้อผิดพลาดโหลดข้อมูล: ' + err.message); }
    }

    async function startCamera() {
      const video = document.getElementById('video');
      if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: currentFacingMode, width: { ideal: 640 }, height: { ideal: 480 } }
      });
      video.srcObject = stream;
      video.style.transform = currentFacingMode === 'user' ? 'scaleX(-1)' : 'none';
      document.getElementById('overlay').style.transform = video.style.transform;
    }

    // 💡 ข้อ 2 & ข้อ 1: คำนวณประเภทการลงเวลามนุษย์ให้อัตโนมัติ (เช็กเวลา 06:00 - 08:00)
    function autoSelectActionForEmployee(empId) {
      if (manualOverrideAction) return manualOverrideAction; // ถ้าเลือกเองให้ใช้ค่าที่เลือก

      const status = todayStatusMap[empId] || {};
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      let action = 'เข้างาน';

      if (!status.lastNormal) {
        // 06:00 (360 นาที) - 08:00 (480 นาที)
        if (currentMinutes >= 360 && currentMinutes <= 480) {
          action = 'เข้างาน';
        } else if (currentMinutes > 480) {
          action = 'เข้างาน (สาย)';
        } else {
          action = 'เข้างาน';
        }
      } else if (status.lastNormal === 'เข้างาน' || status.lastNormal === 'เข้างาน (สาย)') {
        action = 'ออกงาน';
      } else if (status.lastNormal === 'ออกงาน') {
        if (!status.lastOT) action = 'เข้าทำ OT';
        else if (status.lastOT === 'เข้าทำ OT') action = 'ออก OT';
        else action = 'เข้างาน';
      }

      updateBadgeUI(action);
      return action;
    }

    function updateBadgeUI(action) {
      const badge = document.getElementById('actionBadge');
      badge.innerText = action;
      if (action === 'เข้างาน') {
        badge.className = 'action-badge badge-normal';
        badge.innerText = '🟢 เข้างานปกติ';
      } else if (action === 'เข้างาน (สาย)') {
        badge.className = 'action-badge badge-late';
        badge.innerText = '🟠 เข้างาน (สาย)';
      } else if (action.includes('OT')) {
        badge.className = 'action-badge badge-ot';
        badge.innerText = '🔵 ' + action;
      } else {
        badge.className = 'action-badge badge-normal';
        badge.innerText = '🔴 ' + action;
      }
    }

    function openManualModal() {
      document.getElementById('overrideModal').style.display = 'flex';
    }

    function closeManualModal() {
      document.getElementById('overrideModal').style.display = 'none';
    }

    function applyManualAction() {
      manualOverrideAction = document.getElementById('manualActionSelect').value;
      updateBadgeUI(manualOverrideAction);
      closeManualModal();
      setStatus('✏️ เลือกรายการเองเป็น: ' + manualOverrideAction);
    }

    function showQuickPopup(name, action) {
      const popup = document.getElementById('quickPopup');
      document.getElementById('popupName').innerText = 'คุณ ' + name;
      document.getElementById('popupType').innerText = 'สถานะ: ' + action;
      popup.style.display = 'block';

      if (popupTimer) clearTimeout(popupTimer);
      popupTimer = setTimeout(() => {
        popup.style.display = 'none';
      }, 3000); // 💡 เด้งค้างไว้ 3 วินาที
    }

    function addLogItem(name, type, time) {
      const container = document.getElementById('logItems');
      const div = document.createElement('div');
      div.className = 'log-item';
      div.innerHTML = `<span>${name}</span><span class="badge" style="background:#334155; color:#fff;">${type} • ${time}</span>`;
      container.prepend(div);
      while (container.children.length > 8) container.removeChild(container.lastChild);
    }

    function drawProgressCircle(ctx, box, progress) {
      const centerX = box.x + box.width / 2;
      const centerY = box.y + box.height / 2;
      const radius = Math.max(box.width, box.height) / 2 + 15;
      ctx.beginPath(); ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.lineWidth = 6; ctx.stroke();
      ctx.beginPath(); ctx.arc(centerX, centerY, radius, -Math.PI / 2, (-Math.PI / 2) + (2 * Math.PI * progress));
      ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 6; ctx.stroke();
    }

    function detectLoop() {
      const video = document.getElementById('video');
      const overlay = document.getElementById('overlay');

      setInterval(async () => {
        if (isProcessing || !matcher || video.paused || video.readyState < 3) return;
        isProcessing = true;

        try {
          const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }))
            .withFaceLandmarks().withFaceDescriptor();

          const dims = faceapi.matchDimensions(overlay, video, true);
          const ctx = overlay.getContext('2d');
          ctx.clearRect(0, 0, overlay.width, overlay.height);

          if (detection) {
            const match = matcher.findBestMatch(detection.descriptor);
            const resized = faceapi.resizeResults(detection, dims);
            const landmarks = resized.landmarks.positions;
            const distLeft = Math.abs(landmarks[30].x - landmarks[2].x);
            const distRight = Math.abs(landmarks[14].x - landmarks[30].x);
            const yawRatio = distLeft / (distLeft + distRight);

            if (match.label !== 'unknown') {
              const empId = match.label;
              const empObj = employeesData.find(e => e.id === match.label);
              const empName = empObj ? empObj.name : empId;

              const actionType = autoSelectActionForEmployee(empId);

              if (yawRatio < 0.35 || yawRatio > 0.65) {
                turnProgress = Math.min(1.0, turnProgress + 0.35);
                if (turnProgress >= 1.0) hasTurnedHead = true;
              } else {
                turnProgress = Math.max(0.1, turnProgress - 0.05);
              }

              const box = resized.detection.box;
              drawProgressCircle(ctx, box, turnProgress);
              new faceapi.draw.DrawBox(box, {
                label: `${empName} (${((1 - match.distance) * 100).toFixed(0)}%) ${hasTurnedHead ? '🔓' : '🔒 หันหน้าเพื่อยืนยัน'}`,
                boxColor: '#10b981'
              }).draw(overlay);

              const now = Date.now();
              if (!lastLoggedTime[empId] || now - lastLoggedTime[empId] > COOLDOWN_MS) {
                if (!hasTurnedHead) {
                  setStatus('🔒 ตรวจพบคุณ ' + empName + ' — กรุณาหันหน้าเล็กน้อย...');
                  return;
                }

                lastLoggedTime[empId] = now;
                hasTurnedHead = false; turnProgress = 0;
                setStatus('พบใบหน้า: ' + empName + ' (' + actionType + ') — กำลังบันทึก...');

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640; canvas.height = video.videoHeight || 480;
                const cCtx = canvas.getContext('2d');
                if (currentFacingMode === 'user') { cCtx.translate(canvas.width, 0); cCtx.scale(-1, 1); }
                cCtx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const res = await fetch(WEB_APP_URL, {
                  method: 'POST',
                  body: JSON.stringify({
                    empId: empId, name: empName,
                    department: empObj ? empObj.department : 'ทั่วไป',
                    actionType: actionType, confidence: (1 - match.distance).toFixed(2),
                    snapshot: canvas.toDataURL('image/jpeg', 0.8)
                  })
                });
                const data = await res.json();

                if (data.success) {
                  playBeep();

                  // 💡 ข้อ 5: เสียงตอบรับ
                  speak(`บันทึกเวลา${actionType}สำเร็จแล้วค่ะ คุณ${empName}`);

                  // 💡 ข้อ 3: ป๊อบอัพลอยด่วน 3 วินาที
                  showQuickPopup(empName, actionType);

                  if (!todayStatusMap[empId]) todayStatusMap[empId] = {};
                  if (actionType.includes('เข้างาน') || actionType === 'ออกงาน') todayStatusMap[empId].lastNormal = actionType;
                  if (actionType === 'เข้าทำ OT' || actionType === 'ออก OT') todayStatusMap[empId].lastOT = actionType;

                  manualOverrideAction = null; // รีเซ็ตการ override เมื่อบันทึกสำเร็จ

                  document.getElementById('result').className = actionType.includes('เข้า') ? 'result-in' : 'result-out';
                  document.getElementById('result').innerText = `${empName} — ${actionType} (${data.displayTime})`;
                  addLogItem(empName, actionType, data.displayTime);
                  setStatus('✅ บันทึกสำเร็จเรียบร้อย');
                } else {
                  speak('บันทึกไม่สำเร็จ ' + data.error);
                  setStatus('❌ ' + data.error);
                }
              }
            } else { turnProgress = 0; hasTurnedHead = false; }
          }
        } catch (err) { } finally { isProcessing = false; }
      }, 300);
    }

    init();
  </script>
</body>

</html>
